services:
  - type: web
    name: deep-research
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: APP_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: EMAIL_ADDRESS
        sync: false
      - key: EMAIL_SMTP_SERVER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: DEFAULT_EMAIL_TO
        sync: false
